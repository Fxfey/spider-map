# spider-map configuration
#
# This file is written on first run. Edit it and restart the server to apply
# changes; nothing here is read again while the server is up.

# Port for the embedded web server, which serves both the map UI and the REST
# API from the same origin (so the browser never needs CORS).
web-port: 8080

# The address players should open to reach the web UI.
#
# Leave blank to use http://localhost:<web-port>, which is right when you are
# playing on the same machine as the server. Set it to whatever players
# actually type otherwise — your server's address, or the public hostname if
# you have put a reverse proxy in front (SDLC §7):
#
#   public-url: "https://map.example.com"
#   public-url: "http://203.0.113.10:8080"
#
# This is only used for the clickable link in /claims weblogin; it does not
# change what the server listens on.
public-url: ""

# Claim storage file, relative to this plugin's folder
# (plugins/spider-map/). Written atomically, so it is safe to back up while
# the server is running.
claims-file: claims.json

# Maximum number of vertices a single claim may have.
vertex-cap: 50

# How long a /claims weblogin code stays valid, in minutes.
#
# Long enough to run the command, find the browser tab and get distracted on
# the way. Codes are single-use, and running the command again replaces the
# previous one, so an unused code is not left lying around.
#
# SDLC §2 suggested 2-5 minutes; that assumed you were already at the browser.
weblogin-code-minutes: 30

# How long an editor stays logged into the web UI, in hours.
#
# This is the session itself, not the code above: once the code is exchanged,
# the browser holds a token for this long before needing /claims weblogin
# again. Long enough to cover a session of building; short enough that a
# forgotten browser tab does not stay an editor forever.
session-hours: 12

# Grid size that claim corners snap to, in blocks. 16 is one chunk.
#
# Leave this at 16 unless you know what you are changing. Chunk-aligned claims
# are what let the plugin check a player's position by looking up their current
# chunk, instead of testing every claim on every move. A value that is not a
# factor of 16 breaks that assumption.
chunk-snap-size: 16
